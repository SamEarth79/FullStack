services:
  backend:
    build:
      context: backend/
      dockerfile: Dockerfile.backend
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 8000:8000
    env_file: env/backend.env

  postgres:
    image: postgres:16
    env_file: env/db.env
    volumes:
     - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d my_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: